[project]
name = "bbh-tri"
version = "0.1.0"
description = "Spin-1 bilinear-biquadratic (+NNN) model on the triangular lattice with YASTN iPEPS"
readme = "SPEC.md"
requires-python = ">=3.11"
authors = [{ name = "Ying-Jer Kao" }]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
    "yastn",
]

[project.optional-dependencies]
ad = ["torch"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbh_tri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (ED, evolution); run with -m slow",
    "ad: needs torch (uv sync --extra ad)",
]
addopts = "-m 'not slow'"

[tool.uv.sources]
yastn = { git = "https://github.com/yastn/yastn", rev = "7ed8ad0e6fd849bae5ecaf545a8d3d5027005501" }
torch = { index = "pytorch-cpu" }

# torch from the CPU-only wheel index (avoids pulling CUDA); switch for GPU nodes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

