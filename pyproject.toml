[project]
name = "bbh-tri"
version = "0.1.0"
description = "Spin-1 bilinear-biquadratic (+NNN) model on the triangular lattice with YASTN iPEPS"
readme = "SPEC.md"
requires-python = ">=3.11"
authors = [{ name = "Ying-Jer Kao" }]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
    "yastn",
]

[project.optional-dependencies]
ad = ["torch"]
cuda = ["torch"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbh_tri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (ED, evolution); run with -m slow",
    "ad: needs torch (uv sync --extra ad)",
    "gpu: needs CUDA torch and a GPU (uv sync --extra cuda); skipped otherwise",
]
addopts = "-m 'not slow'"

[tool.uv.sources]
yastn = { git = "https://github.com/yastn/yastn", rev = "7ed8ad0e6fd849bae5ecaf545a8d3d5027005501" }
# torch for AD: `--extra ad` from the CPU-only wheel index (avoids pulling CUDA), `--extra cuda`
# from the CUDA 13.0 index (needs an NVIDIA driver >= 580). Same torch version on both.
torch = [
    { index = "pytorch-cpu", extra = "ad" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[tool.uv]
conflicts = [[{ extra = "ad" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

